<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>মারইয়াম গণিত শিক্ষক 🌟</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ===== GLOBAL RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Hind Siliguri', 'Nunito', sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
    }
    #root { min-height: 100vh; }
    button { cursor: pointer; border: none; font-family: inherit; }
    input { font-family: inherit; }
    pre { white-space: pre-wrap; word-break: break-word; }

    /* ===== SHARED BUTTONS ===== */
    .btn-primary {
      background: linear-gradient(135deg, #6C63FF, #3F3D56);
      color: white; border: none; border-radius: 50px;
      padding: 14px 28px; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 15px rgba(108,99,255,0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,99,255,0.5); }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: rgba(255,255,255,0.2); color: white; border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50px; padding: 10px 20px; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: all 0.3s; backdrop-filter: blur(4px);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.35); }
    .btn-success {
      background: linear-gradient(135deg, #6BCB77, #4CAF50);
      color: white; border: none; border-radius: 50px;
      padding: 14px 28px; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 15px rgba(76,175,80,0.4);
    }
    .btn-success:hover { transform: translateY(-2px); }

    /* ===== MASCOT ===== */
    .mascot { font-size: 4rem; display: block; text-align: center; animation: bounce 2s infinite; }
    .mascot-small { font-size: 1.8rem; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeInDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes slideInLeft { from{opacity:0;transform:translateX(-30px)} to{opacity:1;transform:translateX(0)} }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-3deg)} 75%{transform:rotate(3deg)} }
    @keyframes starPop { 0%{transform:scale(0) rotate(-30deg);opacity:0} 60%{transform:scale(1.3) rotate(10deg)} 100%{transform:scale(1) rotate(0);opacity:1} }
    @keyframes confettiFall {
      0%{transform:translateY(-10px) rotate(0deg);opacity:1}
      100%{transform:translateY(100vh) rotate(720deg);opacity:0}
    }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    /* ===== PROGRESS BAR ===== */
    .progress-bar-container {
      background: rgba(255,255,255,0.3); border-radius: 20px; height: 12px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: linear-gradient(90deg, #FFD93D, #FF6B6B);
      border-radius: 20px; transition: width 0.5s ease;
    }

    /* ===== FEEDBACK TOAST ===== */
    .feedback-toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 12px 28px; border-radius: 50px; font-weight: 700; font-size: 1.1rem;
      z-index: 1000; animation: fadeInDown 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .feedback-toast.correct { background: linear-gradient(135deg, #6BCB77, #4CAF50); color: white; }
    .feedback-toast.wrong { background: linear-gradient(135deg, #FF6B6B, #ee5a24); color: white; }

    /* ===== CONFETTI ===== */
    .confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
    .confetti-piece { position: absolute; top: -10px; border-radius: 3px; animation: confettiFall linear forwards; }

    /* ===== APP WRAPPER ===== */
    .app { min-height: 100vh; }

    /* ===== WELCOME SCREEN ===== */
    .welcome-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; position: relative; overflow: hidden;
    }
    .bg-shapes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .bg-shape { position: absolute; font-size: 2rem; opacity: 0.15; animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-20px) rotate(10deg)} }
    .bg-shape-0{top:10%;left:5%;animation-delay:0s}
    .bg-shape-1{top:20%;left:85%;animation-delay:.5s}
    .bg-shape-2{top:60%;left:8%;animation-delay:1s}
    .bg-shape-3{top:70%;left:80%;animation-delay:1.5s}
    .bg-shape-4{top:40%;left:50%;animation-delay:2s}
    .bg-shape-5{top:5%;left:40%;animation-delay:2.5s}
    .bg-shape-6{top:80%;left:30%;animation-delay:3s}
    .bg-shape-7{top:30%;left:20%;animation-delay:3.5s}
    .bg-shape-8{top:85%;left:65%;animation-delay:4s}
    .welcome-content { width: 100%; max-width: 500px; z-index: 1; }
    .welcome-header { text-align: center; margin-bottom: 30px; animation: fadeInDown 0.6s ease; }
    .welcome-title {
      font-size: 2.8rem; font-weight: 900; color: white;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3); line-height: 1.1; margin-top: 10px;
    }
    .title-highlight { color: #FFD93D; }
    .welcome-tagline { color: rgba(255,255,255,0.9); font-size: 1.1rem; margin-top: 8px; }
    .welcome-card {
      background: white; border-radius: 24px; padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: fadeInUp 0.6s ease 0.2s both;
    }
    .step-content { display: flex; flex-direction: column; gap: 16px; }
    .step-title { font-size: 1.4rem; font-weight: 800; color: #3F3D56; }
    .step-desc { color: #666; font-size: 1rem; }
    .name-input {
      width: 100%; padding: 14px 18px; border: 3px solid #e8e8f0; border-radius: 16px;
      font-size: 1.1rem; font-weight: 600; outline: none; transition: border-color 0.3s;
    }
    .name-input:focus { border-color: #6C63FF; }
    .input-error { color: #FF6B6B; font-size: 0.9rem; font-weight: 600; }
    .welcome-btn { width: 100%; margin-top: 8px; }
    .grade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grade-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 12px 8px; border: 3px solid #e8e8f0; border-radius: 16px;
      background: white; cursor: pointer; transition: all 0.3s; font-size: 0.85rem;
    }
    .grade-btn:hover { border-color: #6C63FF; transform: translateY(-2px); }
    .grade-btn-selected { border-color: #6C63FF; background: #f0effe; }
    .grade-emoji { font-size: 1.8rem; }
    .grade-label { font-weight: 800; color: #3F3D56; }
    .grade-desc { color: #888; font-size: 0.75rem; }
    .step-actions { display: flex; gap: 12px; }
    .step-actions .btn-secondary { color: #666; border-color: #ddd; background: #f5f5f5; }
    .step-actions .btn-primary { flex: 1; }
    .features-row {
      display: flex; justify-content: center; gap: 12px; margin-top: 20px;
      flex-wrap: wrap; animation: fadeInUp 0.6s ease 0.4s both;
    }
    .feature-badge {
      display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.2);
      color: white; padding: 8px 14px; border-radius: 50px; font-weight: 700; font-size: 0.9rem;
      backdrop-filter: blur(4px);
    }

    /* ===== DASHBOARD ===== */
    .dashboard { min-height: 100vh; display: flex; flex-direction: column; }
    .dash-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
    }
    .dash-greeting { display: flex; align-items: center; gap: 12px; }
    .dash-hello { color: white; font-weight: 800; font-size: 1.1rem; }
    .dash-subtitle { color: rgba(255,255,255,0.8); font-size: 0.85rem; }
    .dash-stars-total { display: flex; align-items: center; gap: 8px; color: white; font-weight: 800; font-size: 1.1rem; }
    .stars-icon { font-size: 1.4rem; }
    .stars-count { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; }
    .reset-btn { background: rgba(255,255,255,0.15); border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 1.1rem; cursor: pointer; transition: background 0.3s; color: white; }
    .reset-btn:hover { background: rgba(255,255,255,0.3); }
    .dash-progress-strip {
      display: flex; align-items: center; gap: 12px; padding: 12px 20px;
      background: rgba(255,255,255,0.1);
    }
    .progress-label { color: rgba(255,255,255,0.9); font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
    .dash-progress-strip .progress-bar-container { flex: 1; }
    .progress-percent { color: white; font-weight: 800; font-size: 0.9rem; white-space: nowrap; }
    .dash-content { flex: 1; padding: 20px; overflow-y: auto; }
    .dash-section-title { color: white; font-size: 1.3rem; font-weight: 800; margin-bottom: 16px; }
    .topics-grid { display: flex; flex-direction: column; gap: 12px; }
    .topic-card {
      display: flex; align-items: center; gap: 14px; padding: 16px 20px;
      background: white; border-radius: 20px; cursor: pointer;
      transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: left; width: 100%;
    }
    .topic-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
    .topic-card.topic-completed { border-left: 5px solid #6BCB77; }
    .topic-number { font-size: 0.75rem; font-weight: 800; color: #999; min-width: 24px; }
    .topic-icon { font-size: 2rem; }
    .topic-info { flex: 1; }
    .topic-title { font-weight: 800; color: #3F3D56; font-size: 1rem; }
    .topic-subtitle { color: #888; font-size: 0.8rem; }
    .topic-grade { font-size: 0.7rem; color: #aaa; margin-top: 2px; }
    .topic-stars { display: flex; gap: 2px; font-size: 1rem; }
    .topic-stars .earned { color: #FFD93D; }
    .topic-stars .empty { color: #ddd; }
    .topic-badge { font-size: 1.2rem; }
    .topic-arrow { color: #ccc; font-size: 1rem; }
    .fun-fact-banner {
      display: flex; align-items: flex-start; gap: 12px; margin-top: 20px;
      background: rgba(255,255,255,0.15); border-radius: 16px; padding: 16px 20px;
      color: white; backdrop-filter: blur(4px);
    }
    .fun-fact-banner p { font-size: 0.95rem; line-height: 1.5; }

    /* ===== LESSON VIEW ===== */
    .lesson-view { min-height: 100vh; display: flex; flex-direction: column; }
    .lesson-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
    }
    .lesson-topic-label { display: flex; align-items: center; gap: 8px; color: white; font-weight: 700; }
    .lesson-slide-count { color: rgba(255,255,255,0.9); font-weight: 700; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; }
    .lesson-progress-bar { height: 6px; background: rgba(255,255,255,0.3); }
    .lesson-progress-fill { height: 100%; background: linear-gradient(90deg, #FFD93D, #FF6B6B); transition: width 0.5s; }
    .lesson-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .lesson-card {
      background: white; border-radius: 24px; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15); animation: fadeInUp 0.4s ease;
    }
    .lesson-slide-header { padding: 24px; color: white; }
    .lesson-mascot-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .lesson-speech-bubble {
      background: rgba(255,255,255,0.25); border-radius: 16px; padding: 10px 14px;
      color: white; font-size: 0.9rem; font-weight: 600; flex: 1;
    }
    .lesson-slide-title { font-size: 1.4rem; font-weight: 900; }
    .lesson-section { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; }
    .lesson-section:last-child { border-bottom: none; }
    .lesson-section-label { font-size: 0.8rem; font-weight: 800; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .lesson-story-box { color: #444; font-size: 1rem; line-height: 1.7; }
    .lesson-visual-box {
      background: linear-gradient(135deg, #f8f9ff, #e8ecff);
      border-radius: 16px; padding: 20px; text-align: center;
    }
    .lesson-visual-text { font-size: 1.1rem; font-family: 'Nunito', monospace; color: #3F3D56; font-weight: 700; text-align: center; }
    .lesson-explanation-box {
      background: #fff9e6; border-left: 4px solid #FFD93D;
      border-radius: 0 12px 12px 0; padding: 14px 16px;
      color: #444; font-size: 1rem; line-height: 1.6;
    }
    .lesson-tip-box {
      margin: 16px 20px; background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      border-radius: 16px; padding: 14px 18px; color: #2e7d32;
      font-size: 0.95rem; font-weight: 600;
    }
    .lesson-nav { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .slide-dots { display: flex; gap: 8px; }
    .slide-dot {
      width: 12px; height: 12px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.3s;
    }
    .slide-dot-active { background: white; transform: scale(1.3); }
    .lesson-next-btn { min-width: 220px; }

    /* ===== PRACTICE PROBLEMS ===== */
    .practice-view { min-height: 100vh; display: flex; flex-direction: column; }
    .practice-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
    }
    .practice-topic-label { display: flex; align-items: center; gap: 8px; color: white; font-weight: 700; }
    .practice-score { background: rgba(255,255,255,0.2); color: white; padding: 4px 14px; border-radius: 20px; font-weight: 800; }
    .practice-content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .practice-mascot-row { display: flex; align-items: center; gap: 12px; }
    .practice-speech {
      background: rgba(255,255,255,0.2); color: white; border-radius: 16px;
      padding: 10px 16px; font-size: 0.95rem; font-weight: 600; flex: 1;
    }
    .problem-card {
      background: white; border-radius: 24px; padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15); display: flex; flex-direction: column; gap: 16px;
      animation: slideInLeft 0.4s ease;
    }
    .problem-number { font-size: 0.75rem; font-weight: 800; color: #999; text-transform: uppercase; letter-spacing: 1px; }
    .problem-question { font-size: 1.2rem; font-weight: 800; color: #3F3D56; line-height: 1.5; }
    .problem-visual { background: linear-gradient(135deg, #f8f9ff, #e8ecff); border-radius: 16px; padding: 16px; text-align: center; }
    .problem-visual-text { font-family: 'Nunito', monospace; font-size: 1rem; color: #3F3D56; font-weight: 700; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .option-btn {
      padding: 14px 12px; border: 3px solid #e8e8f0; border-radius: 16px;
      font-size: 1rem; font-weight: 700; color: #3F3D56; background: white;
      cursor: pointer; transition: all 0.3s;
    }
    .option-btn:hover { border-color: #6C63FF; background: #f0effe; }
    .option-selected { border-color: #6C63FF; background: #f0effe; }
    .option-correct { border-color: #6BCB77; background: #e8f5e9; color: #2e7d32; }
    .option-wrong { border-color: #FF6B6B; background: #fff0f0; color: #c62828; }
    .input-answer-area { display: flex; gap: 12px; }
    .answer-input {
      flex: 1; padding: 14px 18px; border: 3px solid #e8e8f0; border-radius: 16px;
      font-size: 1.3rem; font-weight: 700; text-align: center; outline: none; transition: border-color 0.3s;
    }
    .answer-input:focus { border-color: #6C63FF; }
    .hint-btn {
      background: transparent; border: 2px dashed #FFD93D; color: #f39c12;
      padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.3s;
    }
    .hint-btn:hover { background: #fff9e6; }
    .hint-box {
      background: #fff9e6; border: 2px solid #FFD93D; border-radius: 16px;
      padding: 14px 16px; color: #7d5400; font-size: 0.95rem; line-height: 1.6;
    }
    .explanation-box {
      background: #e8f5e9; border: 2px solid #6BCB77; border-radius: 16px;
      padding: 14px 16px; color: #2e7d32; font-size: 0.95rem; line-height: 1.6;
    }
    .problem-actions { display: flex; justify-content: center; }
    .check-btn, .next-problem-btn { min-width: 200px; }

    /* ===== QUIZ SCREEN ===== */
    .quiz-view { min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); }
    .quiz-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
    }
    .quiz-label { display: flex; align-items: center; gap: 8px; color: #FFD93D; font-weight: 800; font-size: 1.1rem; }
    .quiz-score-badge { background: rgba(255,215,61,0.2); color: #FFD93D; padding: 4px 14px; border-radius: 20px; font-weight: 800; }
    .quiz-progress-bar { height: 6px; background: rgba(255,255,255,0.1); }
    .quiz-progress-fill { height: 100%; background: linear-gradient(90deg, #FFD93D, #FF6B6B); transition: width 0.5s; }
    .quiz-content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .quiz-header { text-align: center; }
    .quiz-q-counter { color: rgba(255,255,255,0.6); font-size: 0.9rem; font-weight: 700; }
    .quiz-encouragement { color: #FFD93D; font-weight: 700; font-size: 1rem; margin-top: 4px; }
    .quiz-card {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px; padding: 24px; backdrop-filter: blur(10px);
      display: flex; flex-direction: column; gap: 16px; animation: fadeInUp 0.4s ease;
    }
    .quiz-mascot-row { display: flex; align-items: center; gap: 12px; }
    .quiz-q-number { color: #FFD93D; font-weight: 900; font-size: 1.1rem; }
    .quiz-question { color: white; font-size: 1.2rem; font-weight: 800; line-height: 1.5; }
    .quiz-visual { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 14px; text-align: center; }
    .quiz-visual-text { color: rgba(255,255,255,0.9); font-family: 'Nunito', monospace; font-size: 1rem; font-weight: 700; }
    .quiz-options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .quiz-option {
      display: flex; align-items: center; gap: 10px; padding: 14px 16px;
      background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2);
      border-radius: 16px; cursor: pointer; transition: all 0.3s; text-align: left;
    }
    .quiz-option:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
    .quiz-option-selected { background: rgba(108,99,255,0.3); border-color: #6C63FF; }
    .quiz-option-correct { background: rgba(107,203,119,0.3); border-color: #6BCB77; }
    .quiz-option-wrong { background: rgba(255,107,107,0.3); border-color: #FF6B6B; }
    .quiz-option-disabled { opacity: 0.5; cursor: not-allowed; }
    .quiz-option-letter { background: rgba(255,255,255,0.2); color: #FFD93D; border-radius: 8px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.85rem; flex-shrink: 0; }
    .quiz-option-text { color: white; font-weight: 700; font-size: 0.95rem; }
    .quiz-option-check { margin-left: auto; font-size: 1.1rem; }
    .quiz-option-x { margin-left: auto; font-size: 1.1rem; }
    .quiz-answer-feedback {
      border-radius: 16px; padding: 14px 16px; font-weight: 700; font-size: 0.95rem; animation: fadeInUp 0.3s ease;
    }
    .correct-fb { background: rgba(107,203,119,0.2); color: #6BCB77; border: 1px solid rgba(107,203,119,0.4); }
    .wrong-fb { background: rgba(255,107,107,0.2); color: #FF6B6B; border: 1px solid rgba(255,107,107,0.4); }
    .quiz-actions { display: flex; justify-content: center; }

    const CORRECT_MSGS = ['🎉 অসাধারণ! সঠিক উত্তর!', '⭐ তুমি গণিতের তারকা!', '🏆 দারুণ! চালিয়ে যাও!', '🌟 অবিশ্বাস্য কাজ!', '🎊 সঠিক! তুমি অবিশ্বাস্য!', '🦉 মিয়া তোমাকে নিয়ে গর্বিত!', '🔥 অসাধারণ! পারফেক্ট!', '💫 অনবদ্য! শাবাশ!'];
    const WRONG_MSGS = ['🤔 কাছাকাছি! আবার চেষ্টা করো!', '💪 হার মানো না! তুমি পারবে!', '🦉 মিয়া বলে: প্রতিটি ভুল থেকে শেখা যায়!', '✨ ভালো চেষ্টা! আরেকবার ভাবো...', '🌈 চিন্তা নেই! হিন্ট দেখো!', '💡 খুব কাছাকাছি! নিচের হিন্ট দেখো!'];
    const getCorrectMessage = () => CORRECT_MSGS[Math.floor(Math.random() * CORRECT_MSGS.length)];

    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (type === 'correct') {
          osc.frequency.setValueAtTime(523, ctx.currentTime);
          osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.5);
        } else if (type === 'wrong') {
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.setValueAtTime(180, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'complete') {
          [523, 659, 784, 1047].forEach((f, i) => {
            const o2 = ctx.createOscillator(); const g2 = ctx.createGain();
            o2.connect(g2); g2.connect(ctx.destination);
            o2.frequency.setValueAtTime(f, ctx.currentTime + i * 0.15);
            g2.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
            g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.4);
            o2.start(ctx.currentTime + i * 0.15); o2.stop(ctx.currentTime + i * 0.15 + 0.4);
          });
        }
      } catch {}
    };

      const slides = topic.slides;

      return (
        <div className="lesson-view" style={{ '--topic-gradient': topic.bgGradient }}>
          <div className="lesson-topbar">

            <div className="lesson-card" key={currentSlide}>

    // ============================================================
    // PRACTICE PROBLEMS
    // ============================================================
    function PracticeProblems({ topicId, onComplete, onBack, childName }) {
      const topic = getTopicById(topicId);
      const problems = topic?.practice || [];
      const [currentIdx, setCurrentIdx] = useState(0);
      const [inputValue, setInputValue] = useState('');
      const [selectedOption, setSelectedOption] = useState(null);
      const [feedback, setFeedback] = useState(null);
      const [feedbackMsg, setFeedbackMsg] = useState('');
      const [showHint, setShowHint] = useState(false);
      const [showExplanation, setShowExplanation] = useState(false);
      const [correctCount, setCorrectCount] = useState(0);
      const [animKey, setAnimKey] = useState(0);
      const problem = problems[currentIdx];
      const progress = (currentIdx / problems.length) * 100;

      const checkAnswer = () => {
        if (!problem) return;
        const userAnswer = problem.type === 'multiple-choice' ? selectedOption : inputValue.trim();
        if (!userAnswer) return;
        const isCorrect = userAnswer.toLowerCase() === problem.answer.toLowerCase();
        if (isCorrect) {
          setFeedback('correct'); setFeedbackMsg(getCorrectMessage());
          setCorrectCount(c => c + 1); playSound('correct'); setShowExplanation(true);
        } else {
          setFeedback('wrong'); setFeedbackMsg(getWrongMessage()); playSound('wrong');
        }
      };

      const handleNext = () => {
        if (currentIdx < problems.length - 1) {
          setCurrentIdx(i => i+1); setInputValue(''); setSelectedOption(null);
          setFeedback(null); setFeedbackMsg(''); setShowHint(false);
          setShowExplanation(false); setAnimKey(k => k+1);
        } else { onComplete(); }
      };

      if (!problem) return null;
      return (
        <div className="practice-view">
          {feedback && <div className={`feedback-toast ${feedback}`}>{feedbackMsg}</div>}
          <div className="practice-topbar">
            <button className="btn-secondary back-btn" onClick={onBack}>← পাঠ</button>
            <div className="practice-topic-label"><span>{topic.icon}</span><span>অনুশীলনের সময়! 🎯</span></div>
            <div className="practice-score">✅ {correctCount} / {problems.length}</div>
          </div>
          <div className="lesson-progress-bar"><div className="lesson-progress-fill" style={{ width:`${progress}%` }} /></div>
          <div className="practice-content">
            <div className="practice-mascot-row">
              <span className="mascot-small">🦉</span>
              <div className="practice-speech">
                {feedback === 'correct' ? `চমৎকার ${childName}! সঠিক হয়েছে! 🎉` : feedback === 'wrong' ? `হার মানো না ${childName}! 💪` : `ধাপ ${currentIdx+1} / ${problems.length} — চলো যাও ${childName}! 🚀`}
              </div>
            </div>
            <div className="problem-card" key={animKey}>
              <div className="problem-number">সমস্যা {currentIdx+1} / {problems.length}</div>
              <h3 className="problem-question">{problem.question}</h3>
              {problem.visual && <div className="problem-visual"><pre className="problem-visual-text">{problem.visual}</pre></div>}
              {problem.type === 'multiple-choice' && !showExplanation && (
                <div className="options-grid">
                  {problem.options.map(opt => (
                    <button key={opt} className={`option-btn ${selectedOption === opt ? 'option-selected' : ''} ${feedback === 'correct' && opt === problem.answer ? 'option-correct' : ''} ${feedback === 'wrong' && selectedOption === opt ? 'option-wrong' : ''}`}
                      onClick={() => { if (!feedback) setSelectedOption(opt); }}>{opt}</button>
                  ))}
                </div>
              )}
              {problem.type === 'number-input' && !showExplanation && (
                <div className="input-answer-area">
          <input type="number" className="answer-input" placeholder="তোমার উত্তর লেখো..." value={inputValue} onChange={e => setInputValue(e.target.value)} onKeyDown={e => e.key === 'Enter' && !feedback && checkAnswer()} disabled={!!feedback} autoFocus />
                </div>
              )}
              {!feedback && <button className="hint-btn" onClick={() => setShowHint(h => !h)}>{showHint ? '🔒 হিন্ট লুকাও' : '💡 সাহায্য দরকার?'}</button>}
              {showHint && !feedback && <div className="hint-box"><strong>🦉 মিয়ার হিন্ট:</strong> {problem.hint}</div>}
              {showExplanation && <div className="explanation-box"><strong>✅ ব্যাখ্যা:</strong> {problem.explanation}</div>}
              <div className="problem-actions">
                {!feedback
                  ? <button className="btn-primary check-btn" onClick={checkAnswer} disabled={problem.type === 'multiple-choice' ? !selectedOption : !inputValue.trim()} style={{ opacity: (problem.type === 'multiple-choice' ? selectedOption : inputValue.trim()) ? 1 : 0.5 }}>উত্তর যাচাই ✅</button>
                  : <button className="btn-success next-problem-btn" onClick={handleNext}>{currentIdx < problems.length-1 ? 'পরের সমস্যা ➡️' : 'ক্঵িজ দাও! 🏆'}</button>
                }
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // QUIZ SCREEN
    // ============================================================
    function QuizScreen({ topicId, onComplete, onBack, childName }) {
      const topic = getTopicById(topicId);
      const questions = topic?.quiz || [];
      const [currentIdx, setCurrentIdx] = useState(0);
      const [selected, setSelected] = useState(null);
      const [answered, setAnswered] = useState(false);
      const [correctAnswers, setCorrectAnswers] = useState(0);
      const [answers, setAnswers] = useState([]);
      const [animKey, setAnimKey] = useState(0);
      const question = questions[currentIdx];
      const progress = (currentIdx / questions.length) * 100;
      const isLastQuestion = currentIdx === questions.length - 1;

      const handleSubmit = () => {
        if (!selected || answered) return;
        const isCorrect = selected.toLowerCase() === question.answer.toLowerCase();
        setAnswered(true);
        const updatedAnswers = [...answers, { question: question.question, selected, correct: question.answer, isCorrect }];
        setAnswers(updatedAnswers);
        if (isCorrect) { setCorrectAnswers(c => c+1); playSound('correct'); }
        else { playSound('wrong'); }
      };

      const handleNext = () => {
        if (isLastQuestion) {
          const lastIsCorrect = selected && selected.toLowerCase() === question.answer.toLowerCase();
          const totalCorrect = correctAnswers + (lastIsCorrect && !answered ? 1 : 0);
          const score = Math.round((correctAnswers / questions.length) * 100);
          playSound('complete'); onComplete(score, answers);
        } else {
          setCurrentIdx(i => i+1); setSelected(null); setAnswered(false); setAnimKey(k => k+1);
        }
      };

      if (!question) return null;
      return (
        <div className="quiz-view">
          <div className="quiz-topbar">
            <button className="btn-secondary back-btn" onClick={onBack}>← অনুশীলন</button>
            <div className="quiz-label"><span>🏆</span><span>ক্঵িজের সময়!</span></div>
            <div className="quiz-score-badge">✅ {correctAnswers} / {questions.length}</div>
          </div>
          <div className="quiz-progress-bar"><div className="quiz-progress-fill" style={{ width:`${progress}%` }} /></div>
          <div className="quiz-content">
            <div className="quiz-header">
              <div className="quiz-q-counter">প্রশ্ন {currentIdx+1} / {questions.length}</div>
              <div className="quiz-encouragement">
                {answered ? (selected === question.answer ? '🎉 সঠিক! শাবাশ!' : '💪 চালিয়ে যাও!') : `তুমি পারবে, ${childName}! 🌟`}
              </div>
            </div>
            <div className="quiz-card" key={animKey}>
              <div className="quiz-mascot-row"><span className="mascot-small">🦉</span><div className="quiz-q-number">Q{currentIdx+1}</div></div>
              <h3 className="quiz-question">{question.question}</h3>
              {question.visual && <div className="quiz-visual"><pre className="quiz-visual-text">{question.visual}</pre></div>}
              <div className="quiz-options-grid">
                {question.options.map((opt, i) => {
                  let cls = 'quiz-option';
                  if (answered) {
                    if (opt === question.answer) cls += ' quiz-option-correct';
                    else if (opt === selected) cls += ' quiz-option-wrong';
                    else cls += ' quiz-option-disabled';
                  } else if (selected === opt) cls += ' quiz-option-selected';
                  return (
                    <button key={opt} className={cls} onClick={() => !answered && setSelected(opt)}>
                      <span className="quiz-option-letter">{String.fromCharCode(65+i)}</span>
                      <span className="quiz-option-text">{opt}</span>
                      {answered && opt === question.answer && <span className="quiz-option-check">✅</span>}
                      {answered && opt === selected && opt !== question.answer && <span className="quiz-option-x">❌</span>}
                    </button>
                  );
                })}
              </div>
              {answered && (
                <div className={`quiz-answer-feedback ${selected === question.answer ? 'correct-fb' : 'wrong-fb'}`}>
                  {selected === question.answer ? `🌟 সঠিক! উত্তর হলো "${question.answer}"!` : `সঠিক উত্তর হলো "${question.answer}"। চিন্তা করো না, আবার বুঝে নাও! 💪`}
                </div>
              )}
              <div className="quiz-actions">
                {!answered
                  ? <button className="btn-primary quiz-submit-btn" onClick={handleSubmit} disabled={!selected} style={{ opacity: selected ? 1 : 0.5 }}>উত্তর জমা দাও ✅</button>
                  : <button className="btn-success quiz-next-btn" onClick={handleNext}>{isLastQuestion ? 'আমার ফলাফল দেখো! 🏆' : 'পরের প্রশ্ন ➡️'}</button>
                }
              </div>
            </div>
            <div className="quiz-dots">
              {questions.map((_,i) => (
                <div key={i} className={`quiz-dot ${i < currentIdx ? 'quiz-dot-done' : i === currentIdx ? 'quiz-dot-current' : 'quiz-dot-pending'}`} />
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // RESULTS SCREEN
    // ============================================================
    const RESULT_MESSAGES = {
      3: ['🏆 সর্বোচ্চ স্কোর! তুমি গণিত চ্যাম্পিয়ন!', '🌟 অসাধারণ! তুমি সব প্রশ্নের সঠিক উত্তর দিয়েছ!', '🎊 অবিশ্বাস্য! তুমি সত্যিকারের গণিত প্রতিভা!'],
      2: ['🌟 দারুণ কাজ! তুমি কাছাকাছিই আছো!', '💪 বাহ! ৩ তারকা পেতে অনুশীলন জারি রাখো!', '🎉 ভালো কাজ! প্রতিদিন আরও ভালো হচ্ছো!'],
      1: ['💪 ভালো চেষ্টা! পাঠ আবার দেখো এবং আবার চেষ্টা করো!', '🤗 হার মানো না! সব চ্যাম্পিয়নরাই তোমার মতো শুরু করেছিল!', '🌱 দারুণ শুরু! অনুশীলনের সাথে সকল সম্ভব!'],
    };
    function ResultsScreen({ topicId, score, topicStars, totalStars, childName, onBackToDashboard, onRetry }) {
      const topic = getTopicById(topicId);
      const stars = calculateStars(score);
      const [starsVisible, setStarsVisible] = useState(0);
      const messages = RESULT_MESSAGES[stars];
      const message = messages[Math.floor(Math.random() * messages.length)];
      useEffect(() => {
        const t1 = setTimeout(() => setStarsVisible(1), 400);
        const t2 = setTimeout(() => setStarsVisible(2), 700);
        const t3 = setTimeout(() => setStarsVisible(3), 1000);
        return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
      }, []);
      return (
        <div className="results-view">
          {stars === 3 && <Confetti count={80} />}
          {stars === 2 && <Confetti count={40} />}
          <div className="results-content">
            <div className="results-header-card">
              <div className="results-mascot">🦉</div>
              <h2 className="results-title">{stars === 3 ? 'ওহোহো!' : stars === 2 ? 'শাবাস!' : 'চেষ্টা ভালো ছিল!'}</h2>
              <p className="results-message">{message}</p>
            </div>
            <div className="results-stars-card">
              <div className="results-topic-label"><span>{topic?.icon}</span><span>{topic?.title}</span></div>
              <div className="results-stars-row">
                {[1,2,3].map(s => <span key={s} className={`results-star ${s <= starsVisible ? 'results-star-visible' : 'results-star-hidden'}`}>⭐</span>)}
              </div>
              <div className="results-score-display">
                <div className="results-score-number">{score}%</div>
                <div className="results-score-label">স্কোর</div>
              </div>
              <div className="results-score-breakdown">
                {score >= 80 && '✅ অসাধারণ — ৩টি তারকা পেয়েছ!'}
                {score >= 50 && score < 80 && '✅ ভালো — ২টি তারকা পেয়েছ!'}
                {score < 50 && '⭐ ১টি তারকা — অনুশীলন জারি রাখো!'}
              </div>
            </div>
            <div className="results-total-card">
              <div className="results-total-label">তোমার মোট তারকা</div>
              <div className="results-total-stars">⭐ {totalStars} Stars</div>
              <div className="results-total-bar"><div className="results-total-fill" style={{ width:`${(totalStars/(TOPICS.length*3))*100}%` }} /></div>
            </div>
            <div className="results-actions">
              <button className="results-retry-btn" onClick={onRetry}>🔄 আবার চেষ্টা</button>
              <button className="results-dashboard-btn" onClick={onBackToDashboard}>🏠 ড্যাশবোর্ড</button>
            </div>
            <div className="results-mia-message">
              <span className="mascot-small">🦉</span>
              <p>{stars >= 2 ? `"${childName}, তুমি আমাকে গর্বিত করছো! এভাবে চালিয়ে যাও! 🌟"` : `"${childName}, প্রতিটি বড় গণিতবিদরাই ঠিক তোমার মতো শুরু করেছিল! চালিয়ে যাও! 💪"`}</p>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // APP
    // ============================================================
    function App() {
      const [screen, setScreen] = useState('welcome');
      const [childName, setChildName] = useState('');
      const [grade, setGrade] = useState(1);
      const [currentTopicId, setCurrentTopicId] = useState(null);
      const [currentSlide, setCurrentSlide] = useState(0);
      const [score, setScore] = useState(0);
      const [totalStars, setTotalStars] = useState(0);
      const [topicStars, setTopicStars] = useState({});
      const [quizAnswers, setQuizAnswers] = useState([]);

      useEffect(() => {
        const progress = loadProgress();
        if (progress) {
          setChildName(progress.childName || '');
          setGrade(progress.grade || 1);
          setTopicStars(progress.topicStars || {});
          setTotalStars(progress.totalStars || 0);
          if (progress.childName) setScreen('dashboard');
        }
      }, []);

      const handleStart = (name, selectedGrade) => {
        setChildName(name); setGrade(selectedGrade); setScreen('dashboard');
        saveProgress({ childName: name, grade: selectedGrade, topicStars, totalStars });
      };
      const handleSelectTopic = (topicId) => { setCurrentTopicId(topicId); setCurrentSlide(0); setScreen('lesson'); };
      const handleLessonComplete = () => { setScreen('practice'); setCurrentSlide(0); };
      const handlePracticeComplete = () => { setScore(0); setQuizAnswers([]); setScreen('quiz'); };
      const handleQuizComplete = (finalScore, answers) => {
        setScore(finalScore); setQuizAnswers(answers);
        const stars = finalScore >= 80 ? 3 : finalScore >= 50 ? 2 : 1;
        const newTopicStars = { ...topicStars, [currentTopicId]: Math.max(topicStars[currentTopicId] || 0, stars) };
        const newTotal = Object.values(newTopicStars).reduce((a,b) => a+b, 0);
        setTopicStars(newTopicStars); setTotalStars(newTotal);
        saveProgress({ childName, grade, topicStars: newTopicStars, totalStars: newTotal });
        setScreen('results');
      };
      const handleBackToDashboard = () => { setCurrentTopicId(null); setCurrentSlide(0); setScore(0); setScreen('dashboard'); };
      const handleRetryTopic = () => { setCurrentSlide(0); setScore(0); setScreen('lesson'); };
      const handleResetProgress = () => { setChildName(''); setGrade(1); setTopicStars({}); setTotalStars(0); localStorage.removeItem(STORAGE_KEY); setScreen('welcome'); };

      return (
        <div className="app">
          {screen === 'welcome' && <WelcomeScreen onStart={handleStart} />}
          {screen === 'dashboard' && <Dashboard childName={childName} grade={grade} topicStars={topicStars} totalStars={totalStars} onSelectTopic={handleSelectTopic} onReset={handleResetProgress} />}
          {screen === 'lesson' && <LessonView topicId={currentTopicId} currentSlide={currentSlide} setCurrentSlide={setCurrentSlide} onComplete={handleLessonComplete} onBack={handleBackToDashboard} childName={childName} />}
          {screen === 'practice' && <PracticeProblems topicId={currentTopicId} onComplete={handlePracticeComplete} onBack={() => setScreen('lesson')} childName={childName} />}
          {screen === 'quiz' && <QuizScreen topicId={currentTopicId} onComplete={handleQuizComplete} onBack={() => setScreen('practice')} childName={childName} />}
          {screen === 'results' && <ResultsScreen topicId={currentTopicId} score={score} topicStars={topicStars} totalStars={totalStars} childName={childName} onBackToDashboard={handleBackToDashboard} onRetry={handleRetryTopic} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
